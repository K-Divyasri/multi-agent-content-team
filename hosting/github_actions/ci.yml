# GitHub Actions workflow for Multi-Agent Content Team.
#
# What this does: every time you push code or open a pull request, GitHub spins up
# a fresh Linux machine, installs Python and your dependencies, and runs your tests.
# If the tests pass you get a green checkmark; if they fail, a red X and a log to read.
# It's free on public repos.
#
# The nice part for THIS project -- and it's rare for an "AI project": the tests run
# OFFLINE against deterministic fake agents. pytest never calls a real LLM, so CI
# needs NO API key and NO secrets at all -- nothing to leak, nothing to configure.
# All 18 tests pass on a clean machine, free, on every single push -- including the
# full research -> write -> edit -> human-approval loop.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your repo.
# The real code sits at the repo root too, next to pyproject.toml. GitHub only runs
# workflow files that live under .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # Your tests are pure Python, so they pass on Linux even though you develop on Windows.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster.
          cache: pip
          # Tell the cache where the dependency list lives (the repo root).
          cache-dependency-path: requirements.txt

      # Step 3: install the project's dependencies. requirements.txt lives at
      # the repo root, so pip finds it directly. "--upgrade pip" just
      # makes sure pip itself is current first. (litellm and streamlit are listed in
      # there too and install fine -- they only actually get USED with a real model or
      # the web app, which CI never asks for. The content_team package itself is
      # stdlib-only; these are pytest + the optional extras.)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: run the tests. We run from the repo root, because that's where
      # pyproject.toml and the tests/ folder are. pyproject.toml already tells pytest
      # where the tests live
      # (testpaths = ["tests"]) and how to find the package (pythonpath = ["."]), so a
      # bare "pytest" from there finds and runs the whole suite -- all offline,
      # no API key. The job passes only if every one of the 18 tests passes.
      - name: Run tests
        run: pytest
